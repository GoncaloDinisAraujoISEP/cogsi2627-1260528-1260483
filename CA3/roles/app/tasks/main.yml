---
- name: Install OpenJDK 17
  ansible.builtin.apt:
    name: openjdk-17-jdk-headless
    state: present

- name: Create application directory restricted to developers
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: devuser
    group: developers
    mode: "0770"

- name: Copy the Bookstore JAR
  ansible.builtin.copy:
    src: app.jar
    dest: /opt/app/app.jar
    owner: devuser
    group: developers
    mode: "0750"
  notify: Restart springapp

- name: Write database connection settings (contains credentials)
  ansible.builtin.copy:
    dest: /etc/springapp.env
    owner: root
    group: root
    mode: "0600"
    content: |
      SPRING_DATASOURCE_URL=jdbc:h2:tcp://{{ db_host }}:9092/appdb
      SPRING_DATASOURCE_USERNAME={{ db_user }}
      SPRING_DATASOURCE_PASSWORD={{ db_password }}
      SPRING_JPA_HIBERNATE_DDL_AUTO=update
  no_log: true
  notify: Restart springapp

- name: Install systemd unit for the Bookstore
  ansible.builtin.copy:
    dest: /etc/systemd/system/springapp.service
    mode: "0644"
    content: |
      [Unit]
      Description=Bookstore Spring Boot Application
      After=network.target

      [Service]
      User=devuser
      Group=developers
      WorkingDirectory=/opt/app
      EnvironmentFile=/etc/springapp.env
      ExecStart=/usr/bin/java -jar /opt/app/app.jar
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: Restart springapp

- name: Enable and start the Bookstore
  ansible.builtin.systemd:
    name: springapp
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Health check - /books returns the book list
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/books
    return_content: true
  register: app_check
  until: app_check.status == 200 and 'title' in (app_check.content | default(''))
  retries: 20
  delay: 5
  failed_when: app_check.status != 200 or 'title' not in (app_check.content | default(''))

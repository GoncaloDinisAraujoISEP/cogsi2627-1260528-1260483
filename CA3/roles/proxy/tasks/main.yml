---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure the Bookstore site as a reverse proxy to the app VM
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/bookstore
    mode: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://192.168.56.12:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
  notify: Reload nginx

- name: Enable the Bookstore site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/bookstore
    dest: /etc/nginx/sites-enabled/bookstore
    state: link
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Apply pending reloads before the health check
  ansible.builtin.meta: flush_handlers

- name: Health check - Nginx forwards /books to the Bookstore
  ansible.builtin.uri:
    url: http://127.0.0.1/books
    return_content: true
  register: proxy_check
  until: proxy_check.status == 200 and 'title' in (proxy_check.content | default(''))
  retries: 10
  delay: 3
  failed_when: proxy_check.status != 200 or 'title' not in (proxy_check.content | default(''))

---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default Nginx site configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Configure Nginx reverse proxy for Bookstore application
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/bookstore
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location / {
              proxy_pass http://192.168.56.12:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    mode: '0644'

- name: Enable Bookstore site in Nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/bookstore
    dest: /etc/nginx/sites-enabled/bookstore
    state: link

- name: Enable and restart Nginx service
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    enabled: yes


- name: Health check - Verify Nginx reverse proxy routes to Bookstore API
  ansible.builtin.uri:
    url: http://127.0.0.1/books
    status_code: 200
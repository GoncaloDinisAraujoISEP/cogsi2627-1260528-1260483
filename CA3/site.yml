---
- name: Common configuration (all VMs)
  hosts: all
  become: true
  roles:
    - common

- name: Developers account and PAM password policy (app and db)
  hosts: app:db
  become: true
  roles:
    - security

- name: Database server (H2)
  hosts: db
  become: true
  roles:
    - db

- name: Application server (Bookstore)
  hosts: app
  become: true
  roles:
    - app

- name: Reverse proxy (Nginx)
  hosts: proxy
  become: true
  roles:
    - proxy

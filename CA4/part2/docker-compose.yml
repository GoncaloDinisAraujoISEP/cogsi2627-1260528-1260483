name: ca4-part2

services:
  db:
    build: ./db
    image: ${DOCKERHUB_USER}/cogsi-ca4-db:${TAG}
    environment:
      H2_DB_NAME: ${DB_NAME}
      H2_USER: ${DB_USER}
      H2_PASSWORD: ${DB_PASSWORD}
      H2_TCP_PORT: ${DB_PORT}
      H2_DATA_DIR: /opt/h2-data
    volumes:
      - h2-data:/opt/h2-data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/h2/h2.jar org.h2.tools.Shell -url \"jdbc:h2:tcp://localhost:$${H2_TCP_PORT}/$${H2_DB_NAME}\" -user \"$${H2_USER}\" -password \"$${H2_PASSWORD}\" -sql 'SELECT 1' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  web:
    build: ./web
    image: ${DOCKERHUB_USER}/cogsi-ca4-web:${TAG}
    environment:
      SERVER_PORT: ${WEB_PORT}
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://db:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:${WEB_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
  proxy:
    build: ./proxy
    image: ${DOCKERHUB_USER}/cogsi-ca4-proxy:${TAG}
    environment:
      NGINX_PORT: 80
      WEB_HOST: web
      WEB_PORT: ${WEB_PORT}
    ports:
      - "${PROXY_PORT}:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  h2-data:

networks:
  backend:
  frontend:

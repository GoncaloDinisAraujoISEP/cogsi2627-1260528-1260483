# Spring Boot application properties
spring.application.name=bookstore-api
server.port=8080

# H2 database configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:tcp://192.168.56.10:9092//opt/h2-data/bookstore;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom service metadata properties
service.version=@projectVersion@
service.build-timestamp=@buildTimestamp@
service.environment=dev
